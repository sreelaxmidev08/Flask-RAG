[project]
name = "flask-rag-production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sreelaxmidev08", email = "sreelaxmii.dev@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.4",
    "opensearch-py>=3.2.0",
    "pallets-sphinx-themes>=2.3.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "sphinx>=8,<9",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-log-cabinet>=1.0.1",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
    "torch>=2.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
flask-rag-production = "flask_rag_production:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
