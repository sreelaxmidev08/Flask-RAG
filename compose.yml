services:

  # -------------------------
  # Redis
  # -------------------------
  
  redis:
    image: redis:7-alpine
    container_name: flask_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:16
    container_name: flask_rag_postgres
    environment:
      POSTGRES_DB: flask_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d flask_rag"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -------------------------
  # OpenSearch
  # -------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: flask_rag_opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10


  # -------------------------
  # OpenSearch Dashboard
  # -------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: flask_rag_opensearch_dashboard
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy


  # -------------------------
  # Ollama
  # -------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: flask_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama


  # -------------------------
  # Airflow initialization
  # -------------------------
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: flask_rag_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com


  # -------------------------
  # Airflow Webserver
  # -------------------------
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: flask_rag_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    ports:
      - "8080:8080"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver


  # -------------------------
  # Airflow Scheduler
  # -------------------------
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: flask_rag_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler


  # -------------------------
  # FastAPI
  # -------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask_rag_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_BASE_URL=http://host.docker.internal:3000

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy



# -------------------------
# Volumes
# -------------------------
volumes:
  postgres_data:
  opensearch_data:
  ollama_data:
  airflow_dags:
  airflow_logs:
  airflow_plugins:
  redis_data: